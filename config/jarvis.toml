# Source-controlled defaults. The validation CLI loads this bundle, but it does
# not start a resident supervisor, monitor, or action executor.
[general]
default_profile = "god-mode"
offline_first = true
run_as_administrator = false
raw_audio_persistence = false

[activation]
wake_word = "jarvis"
push_to_talk = "Ctrl+Space"
emergency_stop = "Ctrl+Shift+Pause"

[storage]
database = "%LOCALAPPDATA%/Jarvis/jarvis.db"
recipe_directory = "%LOCALAPPDATA%/Jarvis/learned_commands"
log_retention_days = 7
